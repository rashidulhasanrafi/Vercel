<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hisab - Modern Expense Tracker</title>
    <meta name="description" content="A modern, minimalist expense tracker (Hisab) featuring income/expense management, interactive visualizations, and financial insights." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#151f32', // Custom darker slate for cards
              }
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideDown: {
                '0%': { transform: 'translateY(-20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.7' },
              },
              // New Animations for Splash Screen
              popOutUp: {
                '0%': { transform: 'translate(-50%, 0) scale(0)', opacity: '0' },
                '20%': { opacity: '1', transform: 'translate(-50%, -40px) scale(1)' },
                '100%': { transform: 'translate(-50%, -120px) scale(0.8)', opacity: '0' }
              },
              bookPulse: {
                '0%, 100%': { transform: 'scale(1)', filter: 'brightness(1)' },
                '50%': { transform: 'scale(1.05)', filter: 'brightness(1.2)' }
              },
              logoReveal: {
                '0%': { transform: 'scale(0.5)', opacity: '0', filter: 'blur(10px)' },
                '100%': { transform: 'scale(1)', opacity: '1', filter: 'blur(0)' }
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-out forwards',
              slideUp: 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              slideDown: 'slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              scaleIn: 'scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              float: 'float 3s ease-in-out infinite',
              pulseSoft: 'pulseSoft 2s ease-in-out infinite',
              // Splash specific
              popOutUp: 'popOutUp 2s ease-out forwards',
              bookPulse: 'bookPulse 2s ease-in-out infinite',
              logoReveal: 'logoReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Liquid Glass Mode Styles */
      .liquid-glass-mode {
        transition: all 0.5s ease-in-out;
        background: radial-gradient(circle at 50% 50%, #e2e8f0 0%, #cbd5e1 100%) !important;
      }
      .liquid-glass-mode.dark {
        background: radial-gradient(circle at 50% 50%, #1e293b 0%, #090d16 100%) !important;
      }
      
      /* Target all cards and core containers */
      .liquid-glass-mode .bg-white,
      .liquid-glass-mode .bg-slate-50,
      .liquid-glass-mode .bg-slate-100,
      .liquid-glass-mode .bg-slate-50\/80 {
        background: rgba(255, 255, 255, 0.35) !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.5) !important;
        border-top-color: rgba(255, 255, 255, 0.75) !important;
        border-left-color: rgba(255, 255, 255, 0.75) !important;
        border-bottom-color: rgba(255, 255, 255, 0.25) !important;
        border-right-color: rgba(255, 255, 255, 0.25) !important;
        box-shadow: 
          0 15px 35px 0 rgba(31, 38, 135, 0.08),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.5),
          inset 0 -2px 10px 0 rgba(0, 0, 0, 0.03) !important;
        border-radius: 24px !important;
      }
      
      .liquid-glass-mode.dark .bg-slate-800,
      .liquid-glass-mode .dark\:bg-slate-800,
      .liquid-glass-mode .bg-slate-850,
      .liquid-glass-mode .bg-slate-900,
      .liquid-glass-mode .dark\:bg-slate-900,
      .liquid-glass-mode .bg-white\/90,
      .liquid-glass-mode .bg-slate-900\/80 {
        background: rgba(15, 23, 42, 0.45) !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.08) !important;
        border-top-color: rgba(255, 255, 255, 0.2) !important;
        border-left-color: rgba(255, 255, 255, 0.2) !important;
        border-bottom-color: rgba(0, 0, 0, 0.45) !important;
        border-right-color: rgba(0, 0, 0, 0.45) !important;
        box-shadow: 
          0 15px 35px 0 rgba(0, 0, 0, 0.35),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.12),
          inset 0 -2px 10px 0 rgba(0, 0, 0, 0.25) !important;
        border-radius: 24px !important;
      }
      
      /* Header & Navigation */
      .liquid-glass-mode header {
        background: rgba(255, 255, 255, 0.25) !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3) !important;
      }
      .liquid-glass-mode.dark header {
        background: rgba(15, 23, 42, 0.25) !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      }
      
      /* Make inputs and buttons look glossy and rounded (Liquid 3D style) */
      .liquid-glass-mode input, 
      .liquid-glass-mode select, 
      .liquid-glass-mode textarea {
        background: rgba(255, 255, 255, 0.2) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.35) !important;
        border-top-color: rgba(255, 255, 255, 0.55) !important;
        border-left-color: rgba(255, 255, 255, 0.55) !important;
        border-bottom-color: rgba(0, 0, 0, 0.1) !important;
        border-right-color: rgba(0, 0, 0, 0.1) !important;
        box-shadow: 
          inset 0 2px 4px 0 rgba(0, 0, 0, 0.04),
          0 2px 10px 0 rgba(0, 0, 0, 0.02) !important;
        color: #0f172a !important;
        transition: all 0.3s ease !important;
      }
      
      .liquid-glass-mode.dark input, 
      .liquid-glass-mode.dark select, 
      .liquid-glass-mode.dark textarea {
        background: rgba(15, 23, 42, 0.25) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.1) !important;
        border-top-color: rgba(255, 255, 255, 0.22) !important;
        border-left-color: rgba(255, 255, 255, 0.22) !important;
        border-bottom-color: rgba(0, 0, 0, 0.35) !important;
        border-right-color: rgba(0, 0, 0, 0.35) !important;
        box-shadow: 
          inset 0 2px 4px 0 rgba(0, 0, 0, 0.2),
          0 2px 10px 0 rgba(0, 0, 0, 0.1) !important;
        color: #f8fafc !important;
      }
      
      .liquid-glass-mode input, 
      .liquid-glass-mode select {
        border-radius: 9999px !important; /* Beautiful pill shape from reference */
      }
      .liquid-glass-mode textarea {
        border-radius: 16px !important;
      }
      
      /* Glossy Buttons */
      .liquid-glass-mode button:not([class*="toggle"]):not([class*="relative inline-flex"]):not([class*="absolute"]) {
        position: relative !important;
        overflow: hidden !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border: 1.5px solid rgba(255, 255, 255, 0.45) !important;
        border-top-color: rgba(255, 255, 255, 0.7) !important;
        border-left-color: rgba(255, 255, 255, 0.7) !important;
        border-bottom-color: rgba(0, 0, 0, 0.15) !important;
        border-right-color: rgba(0, 0, 0, 0.15) !important;
        box-shadow: 
          0 4px 15px 0 rgba(0, 0, 0, 0.05),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.5),
          inset 0 -1px 4px 0 rgba(0, 0, 0, 0.05) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        border-radius: 9999px !important; /* Beautiful rounded glass buttons */
      }
      
      .liquid-glass-mode.dark button:not([class*="toggle"]):not([class*="relative inline-flex"]):not([class*="absolute"]) {
        border: 1.5px solid rgba(255, 255, 255, 0.12) !important;
        border-top-color: rgba(255, 255, 255, 0.32) !important;
        border-left-color: rgba(255, 255, 255, 0.32) !important;
        border-bottom-color: rgba(0, 0, 0, 0.45) !important;
        border-right-color: rgba(0, 0, 0, 0.45) !important;
        box-shadow: 
          0 4px 15px 0 rgba(0, 0, 0, 0.25),
          inset 0 2px 4px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 4px 0 rgba(0, 0, 0, 0.3) !important;
      }
      
      /* Buttons Hover & Shiny effect */
      .liquid-glass-mode button:not([class*="toggle"]):not([class*="relative inline-flex"]):not([class*="absolute"]):hover {
        transform: translateY(-1.5px) !important;
        box-shadow: 
          0 8px 25px 0 rgba(0, 0, 0, 0.08),
          inset 0 2px 6px 0 rgba(255, 255, 255, 0.7),
          inset 0 -2px 6px 0 rgba(0, 0, 0, 0.08) !important;
        border-color: rgba(255, 255, 255, 0.6) !important;
      }
      
      .liquid-glass-mode.dark button:not([class*="toggle"]):not([class*="relative inline-flex"]):not([class*="absolute"]):hover {
        box-shadow: 
          0 8px 25px 0 rgba(0, 0, 0, 0.35),
          inset 0 2px 6px 0 rgba(255, 255, 255, 0.28),
          inset 0 -2px 6px 0 rgba(0, 0, 0, 0.4) !important;
        border-color: rgba(255, 255, 255, 0.25) !important;
      }
      
      /* Add linear shiny sweep animation to buttons */
      .liquid-glass-mode button:not([class*="toggle"]):not([class*="relative inline-flex"]):not([class*="absolute"])::after {
        content: '' !important;
        position: absolute !important;
        top: 0 !important;
        left: -100% !important;
        width: 100% !important;
        height: 100% !important;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.35),
          transparent
        ) !important;
        transition: 0.6s !important;
      }
      .liquid-glass-mode button:not([class*="toggle"]):not([class*="relative inline-flex"]):not([class*="absolute"]):hover::after {
        left: 100% !important;
      }
      
      /* Fix Modal Backdrops for Liquid Glass */
      .liquid-glass-mode [class*="fixed inset-0 bg-black/"] {
        background: rgba(15, 23, 42, 0.35) !important;
        backdrop-filter: blur(16px) saturate(120%) !important;
        -webkit-backdrop-filter: blur(16px) saturate(120%) !important;
      }
      
      /* Glowing floating blobs movement */
      @keyframes floatBlob1 {
        0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        33% { transform: translate(60px, -80px) scale(1.25) rotate(120deg); }
        66% { transform: translate(-30px, 30px) scale(0.85) rotate(240deg); }
      }
      @keyframes floatBlob2 {
        0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        33% { transform: translate(-70px, 60px) scale(0.8) rotate(-120deg); }
        66% { transform: translate(40px, -40px) scale(1.2) rotate(-240deg); }
      }
      @keyframes floatBlob3 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -30px) scale(1.15); }
      }
      
      .liquid-glass-mode .float-blob-1 {
        animation: floatBlob1 12s ease-in-out infinite !important;
      }
      .liquid-glass-mode .float-blob-2 {
        animation: floatBlob2 15s ease-in-out infinite !important;
      }
      .liquid-glass-mode .float-blob-3 {
        animation: floatBlob3 10s ease-in-out infinite !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 transition-colors duration-500 ease-in-out">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
